[package]
name = "imagen"
version = "0.1.1"
edition = "2021"
description = "MCP server for image generation and editing via Azure OpenAI and OpenAI APIs"
license = "MIT"
repository = "https://github.com/trailflow-systems-inc/imagen"
readme = "README.md"

[dependencies]
rmcp = { version = "2.1.0", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
schemars = "1"
rand = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }
